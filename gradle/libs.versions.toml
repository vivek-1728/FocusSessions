[versions]
agp                  = "9.4.1"
kotlin               = "2.2.10"
coreKtx              = "1.13.1"
lifecycleRuntimeKtx  = "2.8.4"
activityCompose      = "1.9.1"
composeBom           = "2024.08.00"
hilt                 = "2.60.1"
hiltNavigationCompose = "1.2.0"
hiltWork             = "1.2.0"
room                 = "2.8.5"
datastore            = "1.1.1"
navigationCompose    = "2.7.7"
ksp                  = "2.2.10-2.0.2"
coroutines           = "1.8.1"
accompanistPermissions = "0.34.0"
media3               = "1.4.0"
workmanager          = "2.9.1"
# Firebase
firebaseBom          = "33.1.2"
# Google Identity / Credential Manager
credentials          = "1.3.0"
googleid             = "1.1.1"
play-services-auth   = "21.2.0"
# Coil (profile photo)
coil                 = "2.7.0"
material             = "1.14.0"
junit                = "4.13.2"
coroutinesTest       = "1.8.1"
robolectric          = "4.13"
androidxTestJunit    = "1.2.1"
androidxCoreTesting  = "2.2.0"
turbine              = "1.1.0"
mockk                = "1.13.12"


[libraries]
androidx-core-ktx                = { group = "androidx.core",      name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx   = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",        version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose  = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose        = { group = "androidx.activity",  name = "activity-compose",             version.ref = "activityCompose" }
androidx-compose-bom             = { group = "androidx.compose",   name = "compose-bom",                  version.ref = "composeBom" }
androidx-ui                      = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics             = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling              = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview      = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3               = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose      = { group = "androidx.navigation", name = "navigation-compose",           version.ref = "navigationCompose" }

# Hilt
hilt-android            = { group = "com.google.dagger", name = "hilt-android",             version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger", name = "hilt-compiler",            version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",     name = "hilt-navigation-compose",  version.ref = "hiltNavigationCompose" }
hilt-work               = { group = "androidx.hilt",     name = "hilt-work",                version.ref = "hiltWork" }
hilt-work-compiler      = { group = "androidx.hilt",     name = "hilt-compiler",            version.ref = "hiltWork" }

# Room
room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coroutines
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",  version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Accompanist
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanistPermissions" }

# Media3
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui        = { group = "androidx.media3", name = "media3-ui",        version.ref = "media3" }
media3-session   = { group = "androidx.media3", name = "media3-session",   version.ref = "media3" }

# WorkManager
workmanager-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

# Firebase (via BOM — no versions needed on individual libs)
firebase-bom         = { group = "com.google.firebase", name = "firebase-bom",               version.ref = "firebaseBom" }
firebase-auth        = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-firestore   = { group = "com.google.firebase", name = "firebase-firestore-ktx" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }
firebase-analytics   = { group = "com.google.firebase", name = "firebase-analytics-ktx" }
firebase-storage     = { group = "com.google.firebase", name = "firebase-storage-ktx" }

# Google Identity (Credential Manager)
credentials                  = { group = "androidx.credentials",                               name = "credentials",                         version.ref = "credentials" }
credentials-play-services    = { group = "androidx.credentials",                               name = "credentials-play-services-auth",       version.ref = "credentials" }
googleid                     = { group = "com.google.android.libraries.identity.googleid",     name = "googleid",                            version.ref = "googleid" }
play-services-auth           = { group = "com.google.android.gms",                             name = "play-services-auth",                 version.ref = "play-services-auth" }

# Coil
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Material Components
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Testing
junit                        = { group = "junit",                             name = "junit",                       version.ref = "junit" }
kotlinx-coroutines-test      = { group = "org.jetbrains.kotlinx",            name = "kotlinx-coroutines-test",     version.ref = "coroutinesTest" }
robolectric                  = { group = "org.robolectric",                   name = "robolectric",                 version.ref = "robolectric" }
androidx-test-ext-junit      = { group = "androidx.test.ext",                 name = "junit",                       version.ref = "androidxTestJunit" }
androidx-core-testing        = { group = "androidx.arch.core",                name = "core-testing",                version.ref = "androidxCoreTesting" }
room-testing                 = { group = "androidx.room",                     name = "room-testing",                version.ref = "room" }
turbine                      = { group = "app.cash.turbine",                   name = "turbine",                     version.ref = "turbine" }
mockk                        = { group = "io.mockk",                          name = "mockk",                       version.ref = "mockk" }
compose-ui-test-junit4       = { group = "androidx.compose.ui",              name = "ui-test-junit4" }
compose-ui-test-manifest    = { group = "androidx.compose.ui",              name = "ui-test-manifest" }
hilt-testing                 = { group = "com.google.dagger",                 name = "hilt-android-testing",        version.ref = "hilt" }
work-testing                 = { group = "androidx.work",                     name = "work-testing",                version.ref = "workmanager" }

[plugins]
android-application  = { id = "com.android.application",           version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",      version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android",    version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",           version.ref = "ksp" }
google-services      = { id = "com.google.gms.google-services",    version = "4.4.2" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics",   version = "3.0.2" }
